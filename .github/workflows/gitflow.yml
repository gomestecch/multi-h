name: Gitflow Workflow

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-branch-naming:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Validate branch name
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Branch name: $BRANCH_NAME"
          
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "develop" ]]; then
            echo "Branch is a main branch, continuing..."
            exit 0
          fi
          
          if [[ "$BRANCH_NAME" =~ ^(feature|release|hotfix|bugfix)/.+ ]]; then
            echo "Branch naming follows gitflow convention."
            exit 0
          else
            echo "Error: Branch naming does not follow gitflow convention."
            echo "Branch names should be: feature/*, release/*, hotfix/*, or bugfix/*"
            exit 1
          fi
          
  build-and-test:
    runs-on: ubuntu-latest
    needs: validate-branch-naming
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          
      - name: Verify package.json exists
        id: check_package
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Install dependencies
        if: steps.check_package.outputs.exists == 'true'
        run: npm ci
        
      - name: Check if build script exists
        if: steps.check_package.outputs.exists == 'true'
        id: check_build
        run: |
          if grep -q "\"build\":" package.json; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        
      - name: Build
        if: steps.check_package.outputs.exists == 'true' && steps.check_build.outputs.exists == 'true'
        run: npm run build
        
      - name: Check if test script exists
        if: steps.check_package.outputs.exists == 'true'
        id: check_test
        run: |
          if grep -q "\"test\":" package.json; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        
      - name: Test
        if: steps.check_package.outputs.exists == 'true' && steps.check_test.outputs.exists == 'true'
        run: npm test
        
      - name: Lint if available
        if: steps.check_package.outputs.exists == 'true'
        run: |
          if grep -q "\"lint\":" package.json; then
            npm run lint
          else
            echo "No lint script found, skipping linting"
          fi 