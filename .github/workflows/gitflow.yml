name: Gitflow Workflow

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-branch-naming:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Validate branch name
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Branch name: $BRANCH_NAME"
          
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "develop" ]]; then
            echo "Branch is a main branch, continuing..."
            exit 0
          fi
          
          if [[ "$BRANCH_NAME" =~ ^(feature|release|hotfix|bugfix)/.+ ]]; then
            echo "Branch naming follows gitflow convention."
            exit 0
          else
            echo "Error: Branch naming does not follow gitflow convention."
            echo "Branch names should be: feature/*, release/*, hotfix/*, or bugfix/*"
            exit 1
          fi
          
  build-and-test:
    runs-on: ubuntu-latest
    needs: validate-branch-naming
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Test
        run: npm test || echo "No tests found, skipping tests" 